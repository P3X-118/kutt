services:
  server:
    build:
      context: .
    volumes:
      - custom:/kutt/custom
    environment:
      DEFAULT_DOMAIN: sgc.ai
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kutt}
      DB_USER: ${DB_USER:-postgres}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_ENABLED: "true"
      MAIL_HOST: mail.sgc.ai
      MAIL_PORT: 587
      MAIL_SECURE: "false"
      MAIL_FROM: noreply@sgc.ai
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      DISALLOW_REGISTRATION: "false"
      DISALLOW_ANONYMOUS_LINKS: "true"
      ENABLE_RATE_LIMIT: "true"
      CONTACT_EMAIL: support@sgc.ai
      REPORT_EMAIL: support@sgc.ai
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kutt.rule=Host(`sgc.ai`)"
      - "traefik.http.routers.kutt.entrypoints=web,websecure"
      - "traefik.http.routers.kutt.tls=true"
      - "traefik.http.services.kutt.loadbalancer.server.port=3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres
    restart: always
    user: ${DB_USER:-postgres}
    volumes:
      - db_data_pg:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-kutt}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:alpine
    restart: always
    expose:
      - 6379
volumes:
  db_data_pg:
  custom:
